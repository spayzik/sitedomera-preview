name: Deploy isolated catalog preview
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: preview-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview tooling
        uses: actions/checkout@v4
        with:
          path: preview
      - name: Checkout exact approved catalog candidate
        uses: actions/checkout@v4
        with:
          repository: spayzik/sitedomera
          ref: 8c48db369112ba36bd8a43e337048500140f29db
          path: source
          persist-credentials: false
      - name: Verify exact source SHA
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "8c48db369112ba36bd8a43e337048500140f29db"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install dependencies
        working-directory: source
        run: npm ci
      - name: Build without analytics or Avito credentials
        working-directory: source
        run: npm run build
        env:
          VITE_YM_ID: ''
          AVITO_CLIENT_ID: ''
          AVITO_CLIENT_SECRET: ''
      - name: Verify unmodified production artifact
        working-directory: source
        run: npm run verify:production
      - name: Lint
        working-directory: source
        run: npm run lint
      - name: Audit dependencies
        working-directory: source
        run: npm audit
      - name: Test Avito
        working-directory: source
        run: npm run test:avito
      - name: Test Telegram
        working-directory: source
        run: npm run test:telegram
      - name: Test SEO
        working-directory: source
        run: npm run test:seo
      - name: Test calculator
        working-directory: source
        run: npm run test:calculator
      - name: Test catalog
        working-directory: source
        run: npm run test:catalog
      - name: Verify source remains unchanged
        working-directory: source
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=no)"
      - name: Prepare staging-only artifact
        run: node preview/scripts/stage-preview.mjs source/dist site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only staging dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
